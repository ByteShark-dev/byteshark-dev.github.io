name: Build Site

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Build the standalone Aphidex source at a reviewed revision.
      # Bump this ref when publishing a new Aphidex web release.
      - name: Checkout Aphidex website
        uses: actions/checkout@v4
        with:
          repository: ByteShark-dev/aphidex-web
          ref: 2fe788fa3c054aee405dbe0c7dea0cc272b74fed
          path: aphidex-source
          persist-credentials: false

      - name: Build Aphidex
        working-directory: aphidex-source
        run: |
          npm ci
          npm run build

      - name: Publish Aphidex under /aphidex/
        run: |
          mkdir -p dist/aphidex
          cp -a aphidex-source/dist/. dist/aphidex/
          test -f dist/aphidex/index.html
          test -f dist/aphidex/privacy/index.html
          grep -q 'https://byteshark.app/aphidex/' dist/aphidex/index.html
          if [ -f dist/aphidex/app-ads.txt ] && [ ! -f dist/app-ads.txt ]; then cp dist/aphidex/app-ads.txt dist/app-ads.txt; fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
