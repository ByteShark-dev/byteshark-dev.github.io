<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aphidex | Redirecting</title>
    <meta
      name="description"
      content="The Aphidex landing page moved to its dedicated GitHub Pages project."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://byteshark-dev.github.io/aphidex/" />
    <link rel="icon" type="image/png" sizes="512x512" href="./assets/images/byteshark_graphic_logo.png" />
    <meta http-equiv="refresh" content="0; url=https://byteshark-dev.github.io/aphidex/" />
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgb(30 90 168 / 0.16), transparent 36%),
          linear-gradient(180deg, #07111f 0%, #040d1a 48%, #071625 100%);
        color: #ffffff;
        font-family: Montserrat, Inter, Manrope, sans-serif;
      }

      main {
        width: min(100% - 2rem, 40rem);
        padding: 2.5rem;
        border: 1px solid rgb(66 85 110 / 0.45);
        border-radius: 1.75rem;
        background: linear-gradient(180deg, rgb(13 31 59 / 0.8), rgb(8 21 40 / 0.94));
        box-shadow: 0 24px 90px rgb(0 0 0 / 0.28);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 7vw, 3.25rem);
        line-height: 0.96;
      }

      p {
        margin: 1rem 0 0;
        color: #a7b0ba;
        line-height: 1.7;
      }

      a {
        display: inline-flex;
        margin-top: 1.5rem;
        padding: 0.9rem 1.25rem;
        border-radius: 999px;
        background: #1e5aa8;
        color: #ffffff;
        text-decoration: none;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
    <script>
      window.location.replace('https://byteshark-dev.github.io/aphidex/');
    </script>
  </head>
  <body>
    <main>
      <h1>Aphidex moved</h1>
      <p>
        The standalone Aphidex landing page now lives at its dedicated GitHub Pages URL.
        You should be redirected automatically.
      </p>
      <a href="https://byteshark-dev.github.io/aphidex/">Open Aphidex</a>
    </main>
  </body>
</html>
